      svg.appendChild(el('text',{x:x,y:ey+11,'text-anchor':'middle',fill:COL_DIM,'font-size':8.5},`gw ${r.gateway}`));
    });
    svg.appendChild(el('text',{x:20,y:height-15,fill:COL_DIM,'font-size':10},`Point-to-point: ${p2pRows.map(r=>`${r.name} (${r.network}${r.cidr})`).join(' · ')||'—'}`));
  }

  function renderCommands(plan){
    const lanRows=plan.results.filter(r=>!r.p2p);
    const p2pRows=plan.results.filter(r=>r.p2p);
    const proto=document.getElementById('ppRoutingProto').value;
    const routerId=document.getElementById('ppRouterId').value;
    const bgpOn=document.getElementById('ppBgpEnabled').checked;
    const bgpAsn=document.getElementById('ppBgpAsn').value||'65001';
    const vtpOn=document.getElementById('ppVtpEnabled').checked;
    const vtpDomain=document.getElementById('ppVtpDomain').value||'CORP-NET';
    const stpOn=document.getElementById('ppStpEnabled').checked;
    const stpMode=document.getElementById('ppStpMode').value;
    const dtpOn=document.getElementById('ppDtpEnabled').checked;
    const etherOn=document.getElementById('ppEtherEnabled').checked;
    const portSecOn=document.getElementById('ppPortSecEnabled').checked;
    const hsrpOn=document.getElementById('ppHsrpEnabled').checked;
    const vlansUsed=lanRows.map(r=>r.vlan).filter(v=>v&&v!=='-');
    let out='';
    const S=(t)=>`\n! ===== ${t} =====\n`;
    out+=`! ########################################################\n`;
    out+=`!  VLSM Plan — base ${plan.baseNet}/${plan.basePrefix}\n`;
    out+=`!  Routing: ${proto.toUpperCase()}${bgpOn?' + BGP':''} · VTP: ${vtpOn?'on':'off'} · STP: ${stpOn?'on':'off'}\n`;
    out+=`! ########################################################\n`;
    out+=S('ROUTER R1 — Edge router');
    out+=`hostname R1\nservice password-encryption\nno ip domain-lookup\n`;
    if(p2pRows[0])out+=`\ninterface gig0/0\n description To-L3-Core\n ip address ${p2pRows[0].network} ${p2pRows[0].mask}\n no shutdown\n`;
    out+=`\ninterface gig0/1\n description To-ISP\n ip address <ISP_PUBLIC_IP> <ISP_MASK>\n no shutdown\n`;
    out+=S('ROUTER R1 — Routing');
    if(proto==='ospf'){
      out+=`router ospf 1\n router-id ${routerId}\n`;
      if(p2pRows[0])out+=` network ${p2pRows[0].network} 0.0.0.3 area 0\n`;
      out+=` passive-interface default\n no passive-interface gig0/0\n!\n`;
    }else if(proto==='eigrp'){
      out+=`router eigrp 100\n`;
      if(p2pRows[0])out+=` network ${p2pRows[0].network}\n`;
      out+=` no auto-summary\n!\n`;
    }else if(proto==='rip'){
      out+=`router rip\n version 2\n no auto-summary\n`;
      const nets=new Set();
      if(p2pRows[0])nets.add(p2pRows[0].network.split('.').slice(0,2).join('.')+'.0.0');
      lanRows.forEach(r=>nets.add(r.network.split('.').slice(0,2).join('.')+'.0.0'));
      nets.forEach(n=>out+=` network ${n}\n`);
      out+=`!\n`;
    }
    if(bgpOn){
      out+=S('ROUTER R1 — BGP');
      out+=`router bgp ${bgpAsn}\n bgp log-neighbor-changes\n neighbor <ISP_IP> remote-as <ISP_AS>\n ! advertise summary\n`;
      lanRows.forEach(r=>out+=` network ${r.network} mask ${r.mask}\n`);
      out+=`!\n`;
    }
    out+=`\n! default route to ISP\nip route 0.0.0.0 0.0.0.0 <ISP_NEXT_HOP>\n`;
    out+=S('L3 CORE SWITCH');
    out+=`hostname CORE-SW1\nip routing\n`;
    if(vtpOn){out+=S('L3 CORE — VTP Server');out+=`vtp domain ${vtpDomain}\nvtp mode server\nvtp version 2\n`;}
    if(stpOn){out+=S('L3 CORE — STP Root');out+=`spanning-tree mode ${stpMode}\n`;vlansUsed.forEach(v=>out+=`spanning-tree vlan ${v} root primary\n`);}
    if(dtpOn){out+=S('L3 CORE — DTP');out+=`! DTP enabled on trunk ports (default on)\n`;}
    out+=S('L3 CORE — VLANs');
    lanRows.forEach(r=>{if(r.vlan&&r.vlan!=='-')out+=`vlan ${r.vlan}\n name ${r.name.replace(/\s+/g,'_')}\n`;});
    out+=S('L3 CORE — SVIs');
    lanRows.forEach(r=>{
      if(r.vlan&&r.vlan!=='-'){
        out+=`interface vlan ${r.vlan}\n description ${r.name}\n`;
        if(hsrpOn){out+=` ip address ${r.gateway} ${r.mask}\n standby 1 ip ${r.gateway}\n standby 1 priority 150\n standby 1 preempt\n`;}
        else{out+=` ip address ${r.gateway} ${r.mask}\n`;}
        out+=` no shutdown\n!\n`;
      }
    });
    if(proto==='ospf'){
      out+=S('L3 CORE — OSPF');
      out+=`router ospf 1\n router-id ${routerId}\n`;
      lanRows.forEach(r=>{if(r.vlan&&r.vlan!=='-')out+=` network ${r.network} ${r.wildcard} area 0\n`;});
      if(p2pRows[0])out+=` network ${p2pRows[0].network} 0.0.0.3 area 0\n`;
      out+=`!\n`;
    }else if(proto==='eigrp'){
      out+=S('L3 CORE — EIGRP');
      out+=`router eigrp 100\n no auto-summary\n`;
      lanRows.forEach(r=>out+=` network ${r.network}\n`);
      if(p2pRows[0])out+=` network ${p2pRows[0].network}\n`;
      out+=`!\n`;
    }else if(proto==='rip'){
      out+=S('L3 CORE — RIP');
      out+=`router rip\n version 2\n no auto-summary\n`;
      lanRows.forEach(r=>out+=` network ${r.network}\n`);
      if(p2pRows[0])out+=` network ${p2pRows[0].network}\n`;
      out+=`!\n`;
    }
    out+=S('L3 CORE — Uplink trunks to access switches');
    if(etherOn){
      out+=`interface range gig1/0/1 - 2\n channel-group 1 mode active\n!\n`;
      out+=`interface port-channel 1\n switchport trunk encapsulation dot1q\n switchport mode trunk\n switchport trunk allowed vlan ${vlansUsed.join(',')}\n!\n`;
    }else{
      out+=`interface range gig1/0/1 - 4\n switchport trunk encapsulation dot1q\n switchport mode trunk\n switchport trunk allowed vlan ${vlansUsed.join(',')}\n`;
      out+= dtpOn ? ` switchport mode dynamic desirable\n` : ` switchport nonegotiate\n`;
      out+=`!\n`;
    }
    out+=S('ACCESS SWITCHES (template — repeat per switch)');
    out+=`! On each access switch:\n`;
    if(vtpOn)out+=`vtp domain ${vtpDomain}\nvtp mode client\n`;
    if(stpOn)out+=`spanning-tree mode ${stpMode}\n`;
    out+=`! Uplink to core:\ninterface gig0/1\n switchport trunk encapsulation dot1q\n switchport mode trunk\n`;
    out+= dtpOn ? ` switchport mode dynamic auto\n` : ` switchport mode trunk\n switchport nonegotiate\n`;
    out+=`!\n`;
    lanRows.forEach(r=>{
      if(r.vlan&&r.vlan!=='-'){
        out+=`\n! --- Access ports for ${r.name} (VLAN ${r.vlan}) ---\n`;
        out+=`interface range gig0/2 - 10\n switchport mode access\n switchport access vlan ${r.vlan}\n`;
        if(stpOn)out+=` spanning-tree portfast\n spanning-tree bpduguard enable\n`;
        if(portSecOn)out+=` switchport port-security\n switchport port-security maximum 2\n switchport port-security violation restrict\n switchport port-security mac-address sticky\n`;
        out+=`!\n`;
      }
    });
    out+=S('DHCP (on L3 CORE)');
    lanRows.forEach(r=>{if(r.vlan&&r.vlan!=='-')out+=`ip dhcp excluded-address ${r.gateway}\n`;});
    lanRows.forEach(r=>{if(r.vlan&&r.vlan!=='-')out+=`ip dhcp pool ${r.name.replace(/\s+/g,'_')}\n network ${r.network} ${r.mask}\n default-router ${r.gateway}\n dns-server 8.8.8.8 1.1.1.1\n!\n`;});
    out+=S('SECURITY HARDENING');
    out+=`enable secret <STRONG_SECRET>\nline vty 0 4\n transport input ssh\n login local\n!\nusername admin privilege 15 secret <ADMIN_PASS>\ncrypto key generate rsa modulus 2048\nip ssh version 2\n`;
    if(p2pRows.length){
      out+=S('POINT-TO-POINT LINKS');
      p2pRows.forEach(r=>{out+=`! ${r.name}: ${r.network}${r.cidr}\ninterface gig0/1\n ip address ${r.network} ${r.mask}\n no shutdown\n!\n`;});
    }
    document.getElementById('ppCmdsBlock').textContent=out;
  }

  function renderSupernet(plan){
    const container=document.getElementById('ppSupernetContent');
    if(!plan||plan.results.length===0){container.innerHTML='<p class="hint-line">Generate a valid plan first.</p>';return;}
    const longs=plan.results.map(r=>r.networkLong);
    const min=Math.min(...longs);
    const max=Math.max(...plan.results.map(r=>r.broadcastLong));
    let commonPrefix=0;
    for(let i=31;i>=0;i--){
      const mask=(0xFFFFFFFF<<(32-i))>>>0;
      if((min&mask)===(max&mask)){commonPrefix=32-i;break;}
    }
    const superMask=prefixToMask(commonPrefix);
    const superNet=(min&superMask)>>>0;
    const savedSize=Math.pow(2,32-commonPrefix);
    let html='<div class="tools-grid">';
    html+=`<div class="tool-card"><h3><i class="fas fa-bullseye"></i> Overall Supernet</h3>
      <div class="result-box">
        Allocated subnets: <strong>${plan.results.length}</strong><br>
        First network: <strong>${plan.results[0].network}/${plan.results[0].prefix}</strong><br>
        Last broadcast: <strong>${intToIp(max)}</strong><br>
        Summary route: <strong style="color:var(--accent);">${intToIp(superNet)}/${commonPrefix}</strong><br>
        Mask: <strong>${intToIp(superMask)}</strong><br>
        Wildcard: <strong>${wildcardFromMask(superMask)}</strong><br>
        Total addresses: <strong>${savedSize}</strong>
      </div></div>`;
    html+=`<div class="tool-card"><h3><i class="fas fa-th-list"></i> Per-Department Subnets</h3>
      <div class="result-box">${plan.results.map(r=>`${r.name} → <strong>${r.network}${r.cidr}</strong> (${r.usableCount} usable, req ${r.requested})`).join('<br>')}</div></div>`;
    const sortedDesc=[...plan.results].sort((a,b)=>b.blockSize-a.blockSize);
    html+=`<div class="tool-card"><h3><i class="fas fa-sort-amount-down"></i> VLSM Allocation Order</h3>
      <div class="result-box">${sortedDesc.map((r,i)=>`${i+1}. <strong>${r.name}</strong> — /${r.prefix} (${r.blockSize} addrs, req ${r.requested})`).join('<br>')}</div></div>`;
    html+=`<div class="tool-card"><h3><i class="fas fa-bullhorn"></i> Suggested Route Advertisements</h3>
      <div class="result-box">
        Advertise the summary to reduce routing table size:<br>
        <strong style="color:var(--accent);">${intToIp(superNet)}/${commonPrefix}</strong><br><br>
        For OSPF/EIGRP: <strong>network ${intToIp(superNet)} ${wildcardFromMask(superMask)}</strong> (area 0 for OSPF)<br>
        For BGP: <strong>network ${intToIp(superNet)} mask ${intToIp(superMask)}</strong>
      </div></div>`;
    html+=`<div class="tool-card"><h3><i class="fas fa-brain"></i> Supernetting Examples</h3>
      <div class="result-box">
        2 × /24 → 1 × /23 (e.g. 192.168.0.0/24 + 192.168.1.0/24 = 192.168.0.0/23)<br>
        4 × /24 → 1 × /22 (e.g. 192.168.0-3.0/24 = 192.168.0.0/22)<br>
        2 × /25 → 1 × /24<br>
        2 × /23 → 1 × /22<br><br>
        Formula: summary prefix length = common prefix bits between first and last network.
      </div></div>`;
    html+='</div>';
    container.innerHTML=html;
  }

  let ppLastPlan=null;
  function regenerateAll(){
    const plan=computeVLSM();
    if(!plan){
      document.getElementById('ppPlanStats').innerHTML='';
      document.getElementById('ppPlanBody').innerHTML='';
      document.getElementById('ppTopoSvg').innerHTML='';
      document.getElementById('ppCmdsBlock').textContent='// fix errors above';
      document.getElementById('ppSupernetContent').innerHTML='';
      ppLastPlan=null;
      return;
    }
    ppLastPlan=plan;
    renderPlan(plan);
    renderTopo(plan);
    renderCommands(plan);
    renderSupernet(plan);
  }

  document.getElementById('ppCopyCmds').addEventListener('click',()=>{
    navigator.clipboard.writeText(document.getElementById('ppCmdsBlock').textContent).then(()=>{
      const b=document.getElementById('ppCopyCmds');const o=b.textContent;b.textContent='Copied ✓';setTimeout(()=>b.textContent=o,1400);
    });
  });
  document.getElementById('ppDownloadCmds').addEventListener('click',()=>{
    const blob=new Blob([document.getElementById('ppCmdsBlock').textContent],{type:'text/plain'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='network-config.txt';a.click();
  });

  const ppCalcPrefixSel=document.getElementById('ppCalcPrefix');
  for(let i=1;i<=32;i++){const o=document.createElement('option');o.value=i;o.textContent=i;if(i===26)o.selected=true;ppCalcPrefixSel.appendChild(o);}
  function ipClassAndScope(ip){
    const first=Number(ip.split('.')[0]),second=Number(ip.split('.')[1]);
    let cls='—';
    if(first<128)cls='A';else if(first<192)cls='B';else if(first<224)cls='C';else if(first<240)cls='D (multicast)';else cls='E (experimental)';
    let priv=false;
    if(first===10)priv=true;
    else if(first===172&&second>=16&&second<=31)priv=true;
    else if(first===192&&second===168)priv=true;
    else if(first===127)priv='loopback';
    return{cls,priv};
  }
  function runQuickCalc(){
    const ip=document.getElementById('ppCalcIp').value.trim();
    const prefix=Number(ppCalcPrefixSel.value);
    const box=document.getElementById('ppCalcResult');
    const long=ipToInt(ip);
    if(isNaN(long)){box.innerHTML='<span style="color:var(--danger);">Invalid IPv4 address</span>';return;}
    const maskLong=prefixToMask(prefix);
    const totalSize=Math.pow(2,32-prefix);
    const network=(long&maskLong)>>>0;
    const broadcast=(network+totalSize-1)>>>0;
    const usableCount=totalSize<=2?totalSize:totalSize-2;
    const usableStart=totalSize<=2?network:network+1;
    const usableEnd=totalSize<=2?broadcast:broadcast-1;
    const{cls,priv}=ipClassAndScope(ip);
    box.innerHTML=`
      <strong>Network ID:</strong> ${intToIp(network)}<br>
      <strong>Broadcast:</strong> ${totalSize<=2?'— (n/a)':intToIp(broadcast)}<br>
      <strong>Subnet Mask:</strong> ${intToIp(maskLong)}<br>
      <strong>Wildcard Mask:</strong> ${wildcardFromMask(maskLong)}<br>
      <strong>CIDR:</strong> /${prefix}<br>
      <strong>Total Addresses:</strong> ${totalSize}<br>
      <strong>Usable Hosts:</strong> ${usableCount}<br>
      <strong>Usable Range:</strong> ${intToIp(usableStart)} – ${intToIp(usableEnd)}<br>
      <strong>IP Class:</strong> ${cls}<br>
      <strong>Scope:</strong> ${priv===true?'Private':priv==='loopback'?'Loopback':'Public'}
    `;
  }
  document.getElementById('ppCalcBtn').addEventListener('click',runQuickCalc);
  runQuickCalc();

  document.getElementById('ppGenerateBtn').addEventListener('click',regenerateAll);
  regenerateAll();
}

  document.getElementById('sidebar').classList.toggle('open');
});

  if(e.target===document.getElementById('modalOverlay'))closeModal();
});

/* ============================================================
   PWA: shortcut deep-links (?page=...&section=...) + Service Worker
   ============================================================ */
(function initFromUrl(){
  const params=new URLSearchParams(location.search);
  const page=params.get('page');
  const section=params.get('section');
  const valid=['dashboard','networking','tools','cisco','troubleshoot','linux','labs','diagram','planner','interview','tickets','knowledge','projects','assistant'];
  if(page&&valid.includes(page)){
    navigateTo(page);
    if(page==='interview'){
      setTimeout(()=>{
        const target=document.getElementById(section==='daily'?'gameArea':'quizContainer');
        if(target)target.scrollIntoView({behavior:'smooth',block:'center'});
      },200);
    }
  }else{
    renderDashboard();
  }
})();

if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('./sw.js').catch(err=>console.warn('SW registration failed:',err));
  });
}
